syntax = "proto3";

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.rentahall.featurecatlogservice.grpc";
option java_outer_classname = "FeatureProto";

service FeatureService {
    rpc GetAllFeatures (google.protobuf.Empty) returns (FeatureList);
}

message Feature {
    string id = 1;
    string name = 2;
}

message FeatureList {
    repeated Feature features = 1;
}