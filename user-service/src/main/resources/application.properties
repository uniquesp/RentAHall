spring.application.name=user-service
server.port=8085

# ==== Database Configuration ====
spring.datasource.url=jdbc:mysql://localhost:3306/rentahall?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==== JPA / Hibernate ====
# Changed from 'update' to 'validate' to prevent schema modification attempts
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Fixed deprecated dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==== Additional JPA Settings ====
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ==== Logging (Optional - for better debugging) ====
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.rentahall=DEBUG