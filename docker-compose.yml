version: "3.9"
services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC (agent -> Jaeger OTLP)
      - "4318:4318"     # OTLP HTTP
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
